<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <h2>Array Methods: join() and pop()</h2>
<p id="d1"></p>
<p id="d2"></p>

<script>
    var friends = ["prachi", "aryan", "veer", "sufyan", "umer"];
    document.getElementById("d1").innerHTML = friends.join(" # ");

    first = friends.pop();   // removes last element ("veer")
    document.getElementById("d2").innerHTML = first;
        </script>
</body>
</html>
